apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: tech-challenge
  labels:
    app: analytics-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      containers:
        - name: analytics-service
          image: 710818030245.dkr.ecr.us-east-1.amazonaws.com/analytics-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8005
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 5
            periodSeconds: 5
          env:
            - name: AWS_REGION
              value: "us-east-1"
            - name: AWS_SQS_URL
              value: "https://sqs.us-east-1.amazonaws.com/710818030245/evaluation-events-queue"
            - name: AWS_DYNAMODB_TABLE
              value: "analytics-events"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: AWS_SESSION_TOKEN
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: tech-challenge
spec:
  type: ClusterIP
  selector:
    app: analytics-service
  ports:
    - port: 8080
      targetPort: 8005