apiVersion: apps/v1
kind: Deployment
metadata:
  name: targeting-service
  namespace: tech-challenge
  labels:
    app: targeting-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: targeting-service
  template:
    metadata:
      labels:
        app: targeting-service
    spec:
      containers:
        - name: targeting-service
          image: 710818030245.dkr.ecr.us-east-1.amazonaws.com/targeting-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8003
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 5
          env:
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: databases-secret
                  key: DATABASE_URL_TARGETING
            - name: MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: databases-secret
                  key: MASTER_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: targeting-service
  namespace: tech-challenge
spec:
  type: ClusterIP
  selector:
    app: targeting-service
  ports:
    - port: 8080
      targetPort: 8003